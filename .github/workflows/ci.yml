name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e
      - run: npm run build
      # Base de datos: levanta Postgres con el esquema y prueba permisos.
      - run: npm run db:up
      - run: npm run db:test
